name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary pytest pyspark flake8 "black==26.5.1" apache-airflow==2.8.0

      - name: Run Pytest
        run: |
          pytest tests/

  lint:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install linter tools
        run: pip install --prefer-binary "black==26.5.1" flake8

      - name: Check code formatting
        run: |
          black --check .
          flake8 .

  validate_dags:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install Airflow
        run: pip install --prefer-binary apache-airflow==2.8.0

      - name: Validate DAG syntax
        run: |
          export AIRFLOW__CORE__LOAD_EXAMPLES=False
          airflow dags list

  deploy_notification:
    needs: validate_dags
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Deployment Status Notification
        run: |
          echo "CI/CD workflow completed successfully!"